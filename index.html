<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<title>product preview</title>
</head>
<body>
    <div class="container">
        <div class="container-picture">

            <picture style="width: 100%">
                <source class="image" media="(min-width: 426px)" srcset="./images/image-product-desktop.jpg">
                <img class="image" src="./images/image-product-mobile.jpg" />
              </picture>
       <!--  <img src="./images/image-product-desktop.jpg" class="image" alt=""> -->    
        </div>
        <div class="container-text">
            <div class="perfume">
                <small class="perfume-name">PERFUME</small> 
            </div>
            <div class="perfum-description">
                <h1>Gabrielle Essence Eau De Parfum</h1> 
            </div>
            <div class="text">
                <p class="detail">
            A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>
            </div>
            <div class="price">
                <span class="current">$149.99</span>
                <span class="original">$169.99</span>
            </div>
            <div>
                <button> <img src="images/icon-cart.svg"> Add to Cart</button> 
            </div>
        </div>
    </div>
</body>
</html>
